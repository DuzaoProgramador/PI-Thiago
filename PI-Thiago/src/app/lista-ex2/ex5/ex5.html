<div class="exercicio">
  <h2>Exercício 5 - Lista de nomes</h2>

  <ul>
    <li *ngFor="let nome of nomes; let i = index; let primeiro = first; let ultimo = last">

      {{ i + 1 }} - {{ nome }}

      <span *ngIf="primeiro">
        Primeiro da lista
      </span>

      <span *ngIf="ultimo">
        Último da lista
      </span>

    </li>
  </ul>
</div>
