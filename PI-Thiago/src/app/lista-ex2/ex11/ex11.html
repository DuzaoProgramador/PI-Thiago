<div class="exercicio">
  <h2>Exercício 11 - Exibir somente produtos disponíveis</h2>

  <button (click)="alternarDisponibilidade()">
    {{ somenteDisponiveis ? 'Exibir todos os produtos' : 'Exibir somente disponíveis' }}
  </button>

  <p>
    Exibindo:
    {{ somenteDisponiveis ? 'Somente produtos com estoque' : 'Todos os produtos' }}
  </p>

  <ng-container *ngFor="let produto of produtos">

    <div
      class="produto"
      *ngIf="!somenteDisponiveis || produto.quantidade > 0">

      <h3>{{ produto.nome }}</h3>

      <p>
        Preço:
        {{ produto.preco | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
      </p>

      <p>
        Quantidade disponível: {{ produto.quantidade }}
      </p>

    </div>

  </ng-container>
</div>
