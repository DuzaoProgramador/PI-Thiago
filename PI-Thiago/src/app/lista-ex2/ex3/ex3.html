<div class="exercicio">
  <h2>Exercício 3 - Verificação de idade</h2>

  <p>Idade: {{ idade }} anos</p>

  <p *ngIf="idade < 12">
    Criança
  </p>

  <p *ngIf="idade >= 12 && idade <= 17">
    Adolescente
  </p>

  <p *ngIf="idade >= 18 && idade <= 59">
    Adulto
  </p>

  <p *ngIf="idade >= 60">
    Idoso
  </p>

  <button (click)="diminuirIdade()">Diminuir idade</button>

  <button (click)="aumentarIdade()">Aumentar idade</button>
</div>
