<div class="exercicio">
  <h2>Exercício 2 - Situação do usuário</h2>

  <p *ngIf="usuarioLogado; else naoAutorizado">
    Usuário autenticado
  </p>

  <ng-template #naoAutorizado>
    <p>Acesso não autorizado</p>
  </ng-template>

  <button (click)="alternarLogin()">
    {{ usuarioLogado ? 'Sair' : 'Entrar' }}
  </button>
</div>
